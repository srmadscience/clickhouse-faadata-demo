# Installed on kolcheck by scripts/grafana-provision.sh, which also supplies
# CLICKHOUSE_USER / CLICKHOUSE_PASSWORD to grafana-server's environment.
# Requires the grafana-clickhouse-datasource plugin (4.x).
apiVersion: 1
datasources:
  - name: ClickHouse FAA
    type: grafana-clickhouse-datasource
    uid: clickhouse-faa
    isDefault: true
    jsonData:
      host: xraytunnel
      port: 9000
      protocol: native
      username: ${CLICKHOUSE_USER}
      defaultDatabase: faa
    secureJsonData:
      password: ${CLICKHOUSE_PASSWORD}
