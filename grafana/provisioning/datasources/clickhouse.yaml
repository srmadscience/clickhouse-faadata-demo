# Requires the plugin: grafana-cli plugins install grafana-clickhouse-datasource
# Grafana runs on kolcheck (10.13.1.142:3000). Either copy this file to
# /etc/grafana/provisioning/datasources/ on kolcheck, or run scripts/grafana-datasource.sh.
# If copying, set CLICKHOUSE_USER / CLICKHOUSE_PASSWORD in Grafana's environment (e.g. /etc/default/grafana-server).
apiVersion: 1
datasources:
  - name: ClickHouse FAA
    type: grafana-clickhouse-datasource
    uid: clickhouse-faa
    isDefault: true
    jsonData:
      host: xraytunnel
      port: 9000
      protocol: native
      username: ${CLICKHOUSE_USER}
      defaultDatabase: faa
    secureJsonData:
      password: ${CLICKHOUSE_PASSWORD}
